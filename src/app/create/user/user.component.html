<div class="create-user-container">
  <div class="form-container">
    <h1>𝐅𝐋𝐎</h1>
    <p *ngIf="message" class="info-msg">{{ message }}</p>
    <form (ngSubmit)="onSubmit()">
      <div class="input-container">
        <input
          type="text"
          class="input-field"
          placeholder="Kullanıcı Adı"
          [(ngModel)]="username"
          name="username"
          required
        />
      </div>

      <div class="input-container">
        <input
          type="text"
          class="input-field"
          placeholder="Ad"
          [(ngModel)]="name"
          name="name"
          required
        />
      </div>

      <div class="input-container">
        <input
          type="text"
          class="input-field"
          placeholder="Soyad"
          [(ngModel)]="surname"
          name="surname"
          required
        />
      </div>

      <div class="input-container">
        <input
          type="email"
          class="input-field"
          placeholder="E-posta"
          [(ngModel)]="email"
          name="email"
          (input)="validateEmail()"
          required
        />
        <span *ngIf="!emailValid" class="error-msg">Geçerli bir e-posta giriniz!</span>
      </div>

      <div class="input-container">
        <input
          type="password"
          class="input-field"
          placeholder="Parola"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <div class="input-container">
        <input
          type="text"
          class="input-field"
          placeholder="Adres"
          [(ngModel)]="address"
          name="address"
          required
        />
      </div>

      <div class="input-container">
        <input
          type="text"
          class="input-field"
          placeholder="Telefon (05XXXXXXXXX)"
          [(ngModel)]="mobilePhone"
          name="mobilePhone"
          (input)="validateMobilePhone()"
          required
        />
        <span *ngIf="!mobilePhoneValid" class="error-msg">Telefon formatı hatalı! (05XXXXXXXXX)</span>
      </div>

      <button class="submit-button" type="submit" [disabled]="!emailValid || !mobilePhoneValid">
        Kayıt Ol
      </button>
    </form>

    <p class="login-link">
      Zaten hesabınız var mı? <a routerLink="/login">Giriş Yap</a>
    </p>
  </div>
</div>
