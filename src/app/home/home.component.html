<div class="home-container">
  <!-- Arama ve Filtreleme Bölümü -->
  <div class="search-container mb-4">
    <div class="row">
      <div class="col-md-5">
        <p-dropdown 
          [options]="categories" 
          [(ngModel)]="selectedCategory" 
          optionLabel="name" 
          optionValue="id" 
          placeholder="Kategori Seçin"
          [showClear]="true"
          [styleClass]="'w-100'">
        </p-dropdown>
      </div>
      <div class="col-md-5">
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="searchText" 
          placeholder="Ürün Ara...">
      </div>
      <div class="col-md-2">
        <button 
          class="btn btn-primary w-100" 
          (click)="searchProducts()">
          <i class="pi pi-search"></i> Ara
        </button>
      </div>
    </div>
  </div>

  <!-- Ürünler -->
  <div class="products">
    <div class="product" *ngFor="let product of paginatedProducts" (click)="showProductDetails(product)">
      <img [src]="product.image" alt="{{ product.name }}" class="product-image" />
      <div class="product-info">
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-price">{{ product.price | currency }}</p>
      </div>
    </div>
  </div>
</div>

<!-- Sayfalama Kontrolleri -->
<div class="pagination">
  <button (click)="currentPage = page" *ngFor="let page of pages" [class.active]="currentPage === page">
    {{ page }}
  </button>
</div>

<!-- Ürün Detayları Pop-up -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{ width: '30rem' }" [closable]="true" [header]="selectedProduct?.name">
  <div class="p-fluid">
    <div class="form-group mb-3 text-center">
      <img *ngIf="selectedProduct?.image" [src]="selectedProduct.image" alt="Ürün Resmi" class="img-fluid" style="max-width: 100%; height: auto;">
    </div>
    <div class="form-group mb-3">
      <label><strong>Açıklama:</strong></label>
      <p>{{ selectedProduct?.description }}</p>
    </div>
    <div class="form-group mb-3">
      <label><strong>Fiyat:</strong></label>
      <p class="product-price">{{ selectedProduct?.price | currency }}</p>
    </div>
    <div class="form-group mb-3">
      <label><strong>Kategori:</strong></label>
      <p>{{ selectedProduct?.categoryName }}</p>
    </div>
  </div>
</p-dialog>
