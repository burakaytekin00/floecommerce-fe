<p-toast></p-toast>

<div class="container mt-4">
    <div class="row">
        <div class="col-12 d-flex justify-content-end">
            <button type="button" class="btn btn-success d-flex align-items-center gap-2" (click)="showDialog()">
                <i class="pi pi-plus"></i> Kategori Ekle
            </button>
        </div>
    </div>

    <div class="card mt-3 p-3 shadow-sm">
        <p-table [value]="products" class="table-striped table-hover" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 30%;">Kategori Adı</th>
                    <th>Açıklama</th>
                    <th style="width: 20%;" class="text-center">İşlemler</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{ product.name }}</td>
                    <td>{{ product.description }}</td>
                    <td class="text-center">
                        <button type="button" class="btn btn-outline-primary btn-sm me-2" (click)="editProduct(product)">
                            <i class="pi pi-pencil"></i> Düzenle
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm" (click)="confirmDelete(product)">
                            <i class="pi pi-trash"></i> Sil
                        </button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '30rem' }" [closable]="true" header="Kategori Düzenle">
    <div class="p-fluid">
        <div class="form-group mb-3">
            <label for="categoryName">Kategori Adı</label>
            <input type="text" id="categoryName" class="form-control" [(ngModel)]="categoryName" placeholder="Kategori adı girin..." />
        </div>
        <div class="form-group mb-3">
            <label for="categoryDescription">Kategori Açıklaması</label>
            <textarea id="categoryDescription" class="form-control" rows="3" [(ngModel)]="categoryDescription" placeholder="Kategori açıklaması girin..."></textarea>
        </div>
    </div>
    <ng-template pTemplate="footer">
        <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-secondary" (click)="visible = false">İptal</button>
            <button type="button" class="btn btn-primary" (click)="selectedProduct ? updateCategory() : saveCategory()">Kaydet</button>
        </div>
    </ng-template>
</p-dialog>

<p-confirmDialog header="Onay" icon="pi pi-exclamation-triangle" acceptLabel="Evet" rejectLabel="Hayır"></p-confirmDialog>
